server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name suppertool.vip www.suppertool.vip;

    ssl_certificate     /etc/nginx/ssl/suppertoolvip/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/suppertoolvip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 50M;

    root /var/www/llwin/tool-bcr/khuG/tool-bcr-nohu-khuG-llwin/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# BE
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.suppertool.vip;

    ssl_certificate     /etc/nginx/ssl/suppertoolvip/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/suppertoolvip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 50M;

    location / {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://suppertool.vip" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://127.0.0.1:6058;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "https://suppertool.vip" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
    }
}
